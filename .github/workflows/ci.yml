name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path interop/rust-fixtures/Cargo.toml --check

      - name: Lint Rust fixture generator
        run: cargo clippy --manifest-path interop/rust-fixtures/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Check Scala formatting
        run: |
          ./mill --no-server fmt
          git diff --exit-code

      - name: Verify postcard compatibility vectors
        run: ./mill --no-server interopTest

      - name: Run all Scala tests
        run: ./mill --no-server __.test
