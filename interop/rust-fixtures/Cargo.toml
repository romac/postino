[package]
name = "postino-fixtures"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
crc = "3"
postcard = { version = "=1.1.3", features = ["alloc", "use-crc", "use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
